<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="glass-form-box">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="color: var(--accent);">Reset Password 🔒</h1>
            </div>
            <form id="forgotForm">
                <div class="form-group"><label class="form-label">Enter email</label><input type="email" id="forgotEmail" class="form-input" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
            </form>
            <div style="text-align: center; margin-top: 30px;"><a href="login.html" style="color: #999;">← Back to Login</a></div>
        </div>
    </div>
</body>
</html>
