<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - Kids Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="auth-container">
        <div class="glass-form-box">
            <div style="text-align: center; margin-bottom: 40px;">
                <h1 style="color: var(--accent); font-size: 32px;">Welcome Back!</h1>
                <p style="color: var(--text-secondary);">Login to access tickets</p>
            </div>
            <form id="loginForm">
                <div class="form-group"><label class="form-label">Username</label><input type="text" id="loginUser" class="form-input" placeholder="Enter username" required></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" id="loginPass" class="form-input" placeholder="Enter password" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Login Now</button>
            </form>
            <div style="text-align: center; margin-top: 30px; font-size: 14px;">
                <p>New here? <a href="signup.html" style="color: var(--accent-secondary); font-weight: 700;">Create Account</a></p>
                <a href="forgot.html" style="color: #999; display:block; margin-top:10px;">Forgot Password?</a>
                <a href="index.html" style="color: #999; margin-top: 5px; display: inline-block;">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
