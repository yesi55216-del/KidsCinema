<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Sign Up - Kids Cinema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="glass-form-box">
            <div style="text-align: center; margin-bottom: 40px;"><h1 style="color: var(--accent);">Join Us! 🚀</h1></div>
            <form id="registerForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-input" required></div>
                <div class="form-group"><label style="display:flex; gap:10px; align-items:center; font-size:14px;"><input type="checkbox" required>I agree to the Terms & Privacy Policy</label></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Sign Up</button>
            </form>
            <div style="text-align: center; margin-top: 30px;"><a href="login.html" style="color: var(--accent);">Already have an account? Login</a></div>
        </div>
    </div>
</body>
</html>
