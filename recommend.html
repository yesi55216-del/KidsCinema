<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recommendations - Kids Cinema</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
  <script>
  if (window.top !== window.self) {
    document.documentElement.classList.add('in-frame');
  }
</script>
</head>
<body>
  
  <div class="blob blob-1"></div>
  <div class="app-layout">
    
    <nav class="sidebar glass">
      <div class="brand"><span>🎈</span> Kids Cinema</div>
      <div id="userSidebarArea"></div>
      <ul class="menu-list">
        <li class="menu-item"><a href="index.html" class="menu-link"><span class="menu-icon">🏠</span> Home</a></li>
        <li class="menu-item"><a href="contact.html" class="menu-link"><span class="menu-icon">📩</span> Contact Us</a></li>
        <li class="menu-item"><a href="buyticket.html" class="menu-link"><span class="menu-icon">🎫</span> Buy Tickets</a></li>
        <li class="menu-item"><a href="recommend.html" class="menu-link active"><span class="menu-icon">✨</span> For You</a></li>
      </ul>
      <div style="margin-top: auto;"><li class="menu-item" id="navLoginLink"></li></div>
    </nav>

    <main class="main-content">
      <h1 style="margin-bottom: 30px; font-size: 32px; color: var(--accent);">Recommended For You</h1>
      
      <div class="glass" style="padding: 15px; display:inline-flex; gap: 20px; align-items:center; margin-bottom: 30px; border-radius: 16px;">
          <span style="font-weight:700; color:var(--text-secondary);">Sort By:</span>
          <select id="sortBy" style="border:none; background:transparent; font-weight:600; color:var(--text-primary); outline:none;">
              <option value="rating">Highest Rating ⭐</option>
              <option value="title">Title (A-Z)</option>
          </select>
      </div>

      <div id="recommendGrid" class="grid">
          </div>
    </main>
  </div>

  <div id="detailModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-body">
            <div style="text-align:right; margin-bottom: 10px;"><span id="closeModal" style="cursor:pointer; font-size:28px; color:#94A3B8;">&times;</span></div>
            <div style="display:flex; gap:30px; align-items: flex-start; margin-bottom: 30px;">
                <img id="modalImg" src="" style="width:140px; height:210px; object-fit:cover; border-radius:16px;">
                <div style="flex: 1;"><h2 id="modalTitle" style="margin-bottom:5px; font-size: 28px; color: var(--accent);">Title</h2><p id="modalGenre" style="color:#64748b; font-weight:600;"></p><button id="btnBuyFromModal" class="btn btn-primary">🎟️ Buy Ticket Now</button></div>
            </div>
            <div class="synopsis-box"><span style="font-weight:800; font-size:13px; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:5px;">Synopsis</span><p id="modalDesc" style="margin:0;"></p></div>
            
            <div class="comment-section-title">Reviews <small id="reviewCount" style="color:#64748b; font-weight:500; font-size:14px;"></small></div>
            <div class="comment-input-wrapper">
                <input type="hidden" id="modalMovieId">
                <select id="starInput" class="form-select" style="width:110px; padding:10px; background:white; font-weight:bold; color:#FFB400; border:1px solid #E2E8F0;"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option></select>
                <input id="commentInput" type="text" class="form-input" placeholder="Write a review..." style="flex:1; margin:0; background:white; border:1px solid #E2E8F0;">
                <button id="btnPostComment" class="btn btn-primary btn-small">Post</button>
            </div>
            <div id="commentList" class="comment-list"></div>
        </div>
    </div>
  </div>

</body>
</html>
