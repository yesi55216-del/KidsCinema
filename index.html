<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home - Kids Cinema</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
  <script>
  if (window.top !== window.self) {
    document.documentElement.classList.add('in-frame');
  }
</script>
</head>
<body>
  
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="app-layout">
    
    <nav class="sidebar glass">
      <div class="brand"><span>🎈</span> Kids Cinema</div>
      <div id="userSidebarArea"></div>
      <ul class="menu-list">
        <li class="menu-item"><a href="index.html" class="menu-link active"><span class="menu-icon">🏠</span> Home</a></li>
        <li class="menu-item"><a href="contact.html" class="menu-link"><span class="menu-icon">📩</span> Contact Us</a></li>
        <li class="menu-item"><a href="buyticket.html" class="menu-link"><span class="menu-icon">🎫</span> Buy Tickets</a></li>
        <li class="menu-item"><a href="recommend.html" class="menu-link"><span class="menu-icon">✨</span> For You</a></li>
      </ul>
      <div style="margin-top: auto;">
          <li class="menu-item" id="navLoginLink" style="list-style: none;"></li>
      </div>
    </nav>

    <main class="main-content">
      
      <section class="hero-banner">
        <div class="hero-content">
          <div style="background: white; color: var(--accent-secondary); padding: 8px 20px; border-radius: 50px; display: inline-block; margin-bottom: 15px; font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
             🔥 TRENDING
          </div>
          <h1 class="hero-title">Kids Cinema</h1>
          <p style="color:rgba(255,255,255,0.9); margin-bottom:25px; font-size: 16px;">
            2026 • Animation • Fun for All Ages
          </p>
          
          <div class="search-container">
              <span style="font-size: 20px; padding-left: 15px; display: flex; align-items: center; opacity: 0.7;">🔍</span>
              <input type="text" id="searchInput" class="search-input" placeholder="Search movie title or genre...">
          </div>
        </div>
      </section>

      <section>
        <h2 style="margin-bottom:25px; font-size: 24px; color: var(--text-primary);">Popular Movies</h2>
        <div id="movieGrid" class="grid">
          </div>
      </section>

    </main>
  </div>

  <div id="detailModal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-body">
            
            <div style="text-align:right; margin-bottom: 15px;">
                <span id="closeModal" style="cursor:pointer; font-size:32px; color:#94A3B8; line-height: 0.8;">&times;</span>
            </div>
            
            <div style="display:flex; gap:30px; align-items: flex-start; margin-bottom: 30px;">
                <img id="modalImg" src="" style="width:150px; height:225px; object-fit:cover; border-radius:16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                <div style="flex: 1;">
                    <h2 id="modalTitle" style="margin-bottom:5px; font-size: 28px; color: var(--accent);">Movie Title</h2>
                    <p id="modalGenre" style="font-size:15px; color:#64748b; font-weight: 600; margin-bottom: 20px;">Genre • Rating</p>
                    <button id="btnBuyFromModal" class="btn btn-primary">🎟️ Buy Ticket Now</button>
                </div>
            </div>

            <div class="synopsis-box" style="margin-bottom: 30px;">
                <span style="font-weight:800; font-size:12px; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px; letter-spacing: 1px;">Synopsis</span>
                <p id="modalDesc" style="margin:0; font-size: 15px; line-height: 1.7; color: #334155;">Movie description goes here...</p>
            </div>

            <div class="reviews-wrapper" style="border-top: 2px solid #F1F5F9; padding-top: 25px;">
                <div class="comment-section-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <span style="font-size: 20px; font-weight: 800; color: var(--text-primary);">Reviews & Comments</span>
                    <small id="reviewCount" style="color: #64748b; font-weight: 600;">(0)</small>
                </div>
                
                <div class="comment-input-wrapper">
                    <input type="hidden" id="modalMovieId">
                    <select id="starInput" class="form-select" style="width:auto; min-width: 100px; padding:10px; background:white; font-weight:bold; color:#FFB400; border:1px solid #E2E8F0;">
                        <option value="5">5 ★★★★★</option>
                        <option value="4">4 ★★★★</option>
                        <option value="3">3 ★★★</option>
                        <option value="2">2 ★★</option>
                        <option value="1">1 ★</option>
                    </select>
                    <input id="commentInput" type="text" class="form-input" placeholder="Write your review..." style="flex:1; margin:0; background:white; border:1px solid #E2E8F0;">
                    <button id="btnPostComment" class="btn btn-primary btn-small">Post</button>
                </div>

                <div id="commentList" class="comment-list" style="margin-top: 20px;">
                    </div>
            </div>

        </div>
    </div>
  </div>

</body>
</html>
