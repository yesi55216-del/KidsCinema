<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us — Kids Cinema</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
  <script>
  if (window.top !== window.self) {
    document.documentElement.classList.add('in-frame');
  }
</script>
</head>
<body>
  <div class="app-layout">
    <nav class="sidebar glass">
      <div class="brand"><span>🎈</span> Kids Cinema</div>
      <div id="userSidebarArea"></div>
      <ul class="menu-list">
        <li class="menu-item"><a href="index.html" class="menu-link"><span class="menu-icon">🏠</span> Home</a></li>
        <li class="menu-item"><a href="contact.html" class="menu-link active"><span class="menu-icon">📩</span> Contact Us</a></li>
        <li class="menu-item"><a href="buyticket.html" class="menu-link"><span class="menu-icon">🎫</span> Buy Tickets</a></li>
        <li class="menu-item"><a href="recommend.html" class="menu-link"><span class="menu-icon">✨</span> For You</a></li>
      </ul>
      <div style="margin-top: auto;"><li class="menu-item" id="navLoginLink"></li></div>
    </nav>
    <main class="main-content">
      <div class="layout-center">
          <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 38px; color: var(--accent);">Get in Touch</h1>
            <p style="color:var(--text-secondary);">We are here to help you and your family!</p>
          </div>
          <div class="glass" style="padding: 50px; background: white; width: 100%; max-width: 500px; border-radius: 30px; box-shadow: 0 25px 60px rgba(0,0,0,0.08);">
              <form id="contactForm">
                  <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" required></div>
                  <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" required></div>
                  <div class="form-group"><label class="form-label">Message</label><textarea class="form-input" rows="4" required></textarea></div>
                  <button class="btn btn-primary" style="width:100%;">Send Message</button>
              </form>
          </div>
      </div>
    </main>
  </div>
</body>
</html>
